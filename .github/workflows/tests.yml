name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VERSION: '3.4.11'
      SERVERPOD_PASSWORD_database: '7jnsp5Fe0V2PSdo5js4sSie96MTS5k3i'
      SERVERPOD_PASSWORD_redis: 'o_e2dBEEMc0UX1BdmzeXIHoLO1wIrKOq'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'

      - name: Start containers
        working-directory: movie_ticket_app_server
        run: docker compose up --quiet-pull --build -d

      - name: Install dependencies
        run: flutter pub get

      - name: Install Serverpod CLI
        run: dart pub global activate serverpod_cli $VERSION

      - name: Run Serverpod generator
        working-directory: movie_ticket_app_server
        run: serverpod generate

      - name: Run tests
        working-directory: movie_ticket_app_server
        run: dart test

      - name: Stop containers
        if: always()
        working-directory: movie_ticket_app_server
        run: docker compose down -v

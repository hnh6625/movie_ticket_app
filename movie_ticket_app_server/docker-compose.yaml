services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: movie_ticket_app
      POSTGRES_PASSWORD: "SuzyncIoZyy6O7qjbUvZPajRZZuFVcUz"
    volumes:
      - movie_ticket_app_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "POWY-dlKXjcHyjF_hWuFLF-LIHtW3iPj"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: movie_ticket_app_test
      POSTGRES_PASSWORD: "7jnsp5Fe0V2PSdo5js4sSie96MTS5k3i"
    volumes:
      - movie_ticket_app_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "o_e2dBEEMc0UX1BdmzeXIHoLO1wIrKOq"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  movie_ticket_app_data:
  movie_ticket_app_test_data:
